<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 生图加载动效</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="demo-shell" aria-label="AI 生图加载动效示例">
      <section class="generator-card" aria-live="polite">
        <div class="preview-frame" aria-hidden="true">
          <div class="image-placeholder">
            <span class="pixel pixel-a"></span>
            <span class="pixel pixel-b"></span>
            <span class="pixel pixel-c"></span>
            <span class="pixel pixel-d"></span>
            <span class="spark spark-one"></span>
            <span class="spark spark-two"></span>
            <span class="spark spark-three"></span>
          </div>
        </div>

        <div class="status-row">
          <span class="ai-orb" aria-hidden="true"></span>
          <div>
            <h1>AI 正在生成图片</h1>
            <p>正在理解提示词、构图、渲染细节…</p>
          </div>
        </div>

        <div class="progress" role="progressbar" aria-label="生成进度" aria-valuemin="0" aria-valuemax="100">
          <span></span>
        </div>
      </section>
    </main>
  </body>
</html>
